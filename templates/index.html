{% extends "base.html" %}

{% block content %}
<div class="flex flex-col lg:flex-row gap-8 w-full h-full min-h-[calc(100vh-16rem)]">
  
  <aside class="w-full lg:w-64 flex-shrink-0">
    <nav class="flex flex-col gap-1" id="sidebar-nav">
      <a href="#all" data-section="all" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg bg-stone-200 dark:bg-stone-800 text-stone-900 dark:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5 text-stone-600 dark:text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        All Files
      </a>
      <a href="#photos" data-section="photos" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-900 hover:text-stone-900 dark:hover:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Photos
      </a>
      <a href="#videos" data-section="videos" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-900 hover:text-stone-900 dark:hover:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        Videos
      </a>
      <a href="#music" data-section="music" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-900 hover:text-stone-900 dark:hover:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        Music
      </a>
      <a href="#documents" data-section="documents" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-900 hover:text-stone-900 dark:hover:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        Documents
      </a>
      <a href="#trash" data-section="trash" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-stone-600 dark:text-stone-400 hover:bg-stone-100 dark:hover:bg-stone-900 hover:text-stone-900 dark:hover:text-stone-50 font-medium transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        Bin
      </a>
    </nav>
    
    <div class="mt-8 px-4">
      <div class="w-full bg-stone-200 dark:bg-stone-800 rounded-full h-2 mb-2">
        <div id="usage-bar" class="bg-amber-600 h-2 rounded-full w-0"></div>
      </div>
      <p id="usage-text" class="text-xs text-stone-500 dark:text-stone-400"></p>
    </div>

    <div id="uploads" class="mt-8 px-4 flex flex-col gap-3" aria-live="polite"></div>
  </aside>

  <main class="flex-1 min-w-0" id="main-content" data-login-url="{{ login_url }}"></main>
</div>

<input type="file" id="file-input" multiple hidden />
<p id="status" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden px-4 py-2 rounded-lg bg-stone-900 text-stone-50 dark:bg-stone-100 dark:text-stone-900 text-sm shadow-lg" role="status" aria-live="polite"></p>

<dialog id="viewer" class="w-full max-w-5xl rounded-xl p-0 bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100">
  <div class="flex items-center justify-between gap-4 px-4 py-3 border-b border-stone-200 dark:border-stone-800">
    <p id="viewer-title" class="font-medium truncate"></p>
    <button type="button" id="viewer-close" aria-label="Close" class="p-2 text-stone-500 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  <div id="viewer-body" class="p-4 flex flex-col items-center justify-center gap-4"></div>
</dialog>

<script src="{{ url_for('static', filename='js/file-browser.js') }}"></script>
{% endblock %}
